<!DOCTYPE html>
<html lang="ru" class="no-js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Атлас городов — Эхо Эйры</title>
    <meta name="description" content="Все города мира Эйры в одном месте.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">
    <script src="js/head.js"></script>
</head>

<body>

    <div class="mist"></div>
    <div data-component="header"></div>

    <header class="page-hero">
        <div class="page-hero__label">Атлас</div>
        <h1 class="page-hero__title">Города Эйры</h1>
        <p class="page-hero__subtitle">Все города шести империй. В одном месте.</p>
    </header>

    <section class="page-section">
        <div class="container">
            <a href="index.html" class="back-link">На главную</a>

            <div class="atlas-filters" id="atlasFilters">
                <div class="atlas-filters__group">
                    <span class="atlas-filters__label">Регион:</span>
                    <button class="timeline-legend__item active" data-filter-region="all">Все</button>
                    <button class="timeline-legend__item" data-filter-region="eldarhalm">Солнечные Земли</button>
                    <button class="timeline-legend__item" data-filter-region="imirdal">Громовой Имирдал</button>
                    <button class="timeline-legend__item" data-filter-region="aenordal">Аэнордал</button>
                    <button class="timeline-legend__item" data-filter-region="swamp">Болотная</button>
                    <button class="timeline-legend__item" data-filter-region="jauhar">Джаухар</button>
                    <button class="timeline-legend__item" data-filter-region="heavenly">Парящие</button>
                </div>
                <div class="atlas-filters__group">
                    <span class="atlas-filters__label">Тип:</span>
                    <button class="timeline-legend__item active" data-filter-type="all">Все</button>
                    <button class="timeline-legend__item" data-filter-type="Столица">Столицы</button>
                    <button class="timeline-legend__item" data-filter-type="Торговый центр">Торговые</button>
                    <button class="timeline-legend__item" data-filter-type="Пограничный">Пограничные</button>
                </div>
            </div>

            <div class="atlas-counter" id="atlasCounter">Городов: 0</div>

            <div class="atlas-grid" id="atlasGrid"></div>

            <div class="timeline-empty" id="atlasEmpty" style="display: none;">
                Нет городов по выбранным фильтрам.
            </div>
        </div>
    </section>

    <div data-component="footer"></div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
