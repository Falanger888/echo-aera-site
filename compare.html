<!DOCTYPE html>
<html lang="ru" class="no-js">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сравнение регионов — Эхо Эйры</title>
    <meta name="description" content="Сравни регионы Эйры: расы, столицы, философия, экономика.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        html,
        body {
            background: #03040a;
            margin: 0;
            color: #d8d8dc;
        }

        body {
            font-family: system-ui, sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }
    </style>

    <script src="js/head.js"></script>
</head>

<body>

    <div class="mist"></div>
    <div data-component="header"></div>

    <header class="page-hero">
        <div class="page-hero__label">Инструмент</div>
        <h1 class="page-hero__title">Сравнение регионов</h1>
        <p class="page-hero__subtitle">Выбери две стороны и посмотри, чем они отличаются.</p>
    </header>

    <section class="page-section">
        <div class="container">
            <a href="index.html" class="back-link">На главную</a>

            <!-- СЕЛЕКТОРЫ -->
            <div class="compare-selectors reveal">
                <div class="compare-selector">
                    <label class="compare-selector__label">Слева</label>
                    <select class="compare-selector__select" id="compareLeft"></select>
                </div>
                <div class="compare-selector__vs">vs</div>
                <div class="compare-selector">
                    <label class="compare-selector__label">Справа</label>
                    <select class="compare-selector__select" id="compareRight"></select>
                </div>
            </div>

            <!-- ПРЕВЬЮ -->
            <div class="compare-preview" id="comparePreview"></div>

            <!-- ТАБЛИЦА -->
            <div class="compare-table-wrap reveal">
                <table class="compare-table" id="compareTable"></table>
            </div>

        </div>
    </section>

    <div data-component="footer"></div>
    <script type="module" src="js/app.js"></script>
</body>

</html>
